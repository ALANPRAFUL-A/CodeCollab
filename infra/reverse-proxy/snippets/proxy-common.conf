# Shared proxy headers, included by every proxying location in default.conf.
#
# Kept in /etc/nginx/snippets/ rather than /etc/nginx/conf.d/ on purpose: nginx.conf
# does `include /etc/nginx/conf.d/*.conf;` inside its http block, so a fragment
# placed there would be parsed as a top-level http directive and nginx would
# refuse to start.

# Preserve what the BROWSER asked for. Without this the backend sees
# "Host: load-balancer" and any redirect or absolute URL it generates is wrong.
proxy_set_header Host              $host;

# Client identity. $proxy_add_x_forwarded_for appends $remote_addr to any existing
# X-Forwarded-For, building the chain: client -> reverse-proxy -> haproxy.
# The backend's app.set("trust proxy", 2) counts exactly these two trusted hops.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Fail fast on a dead upstream instead of hanging the browser.
proxy_connect_timeout 5s;

# If HAProxy itself is unreachable or errors, try the next upstream server.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
