#==============================================================================
# LAYER 2: REVERSE PROXY  (nginx)  ->  http://localhost:8080
#==============================================================================
# A reverse proxy sits IN FRONT OF YOUR SERVERS and faces the internet. The
# browser only ever talks to this one origin; it has no idea there are three
# backend replicas, a load balancer, a Mongo and a Redis behind it.
#
# Contrast with the forward proxy (layer 5): a forward proxy sits in front of
# CLIENTS and faces the internet on their behalf. Same word "proxy", opposite
# direction of travel. Reverse = protects/fronts servers. Forward = fronts clients.
#
# WHAT THIS LAYER GIVES US
# ------------------------
#  1. ONE ORIGIN. Static SPA and API share http://localhost:8080, so the frontend
#     uses relative URLs, there is zero CORS, and the HAProxy affinity cookie is
#     a plain same-origin cookie.
#  2. PATH ROUTING. /socket.io and /api go to the load balancer; everything else
#     goes to the static file server.
#  3. PROTOCOL TRANSLATION. Terminates the WebSocket upgrade handshake properly.
#  4. EDGE POLICY. Rate limiting, security headers, body size caps, compression -
#     applied once here instead of in every backend replica.
#  5. TOPOLOGY HIDING. Internal service names and ports are never exposed.
#
# This file is mounted at /etc/nginx/conf.d/default.conf, which nginx includes
# from inside its `http { }` block. That is why there is no http/events wrapper.
#==============================================================================

#------------------------------------------------------------------------------
# WEBSOCKET UPGRADE MAP
#------------------------------------------------------------------------------
# A WebSocket handshake is an HTTP request carrying `Upgrade: websocket` and
# `Connection: Upgrade`. Both are hop-by-hop headers, so nginx drops them unless
# we explicitly forward them.
#
# We cannot just hardcode `Connection: upgrade`, because the same location also
# serves Socket.IO's long-polling requests, which have no Upgrade header. This map
# sets Connection to "upgrade" only when the client actually asked for an upgrade,
# and "close" otherwise.
#------------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

#------------------------------------------------------------------------------
# RATE LIMITING ZONES
#------------------------------------------------------------------------------
# 10m of shared memory keyed by client IP. Login/register get a tight limit
# because they are the brute-force target; the rest of the API gets a loose one.
#
# CAVEAT on Docker Desktop (Windows/macOS): traffic arriving through a published
# port often appears to come from the Docker gateway IP, so all local clients can
# share one bucket. Limits are set generously so local testing does not trip them.
#------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=120r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

#------------------------------------------------------------------------------
# UPSTREAMS
#------------------------------------------------------------------------------
# NOTE: nginx resolves these names ONCE at startup. docker-compose therefore uses
# `depends_on: condition: service_healthy` so both targets exist before nginx boots.
#------------------------------------------------------------------------------

# The static SPA container (frontend/nginx.conf).
upstream static_origin {
    server frontend:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# HAProxy, for normal request/response API traffic. Connection pooling here saves
# a TCP handshake per request.
upstream app_lb {
    server load-balancer:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HAProxy again, but WITHOUT keepalive. An upgraded WebSocket connection is not
# reusable, so it must never go into a keepalive pool. Using a separate upstream
# block keeps the two behaviours from interfering.
upstream app_lb_realtime {
    server load-balancer:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    # Yjs updates travel as JSON arrays of bytes, which is a few times larger than
    # the raw binary. 4m is comfortable headroom; the backend caps updates at 1m.
    client_max_body_size 4m;
    client_body_timeout  30s;

    # Cap concurrent connections per IP. Each editor tab uses one WebSocket, so
    # this is set high enough for many tabs but low enough to blunt a flood.
    limit_conn conn_zone 100;

    #--------------------------------------------------------------------------
    # SECURITY HEADERS (applied at the edge, once, for every response)
    #--------------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                  always;

    # Compress proxied responses too (the static container also gzips its own).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    #==========================================================================
    # ROUTE 1: Socket.IO  (WebSocket + long-polling)  ->  load balancer
    #==========================================================================
    location /socket.io/ {
        proxy_pass http://app_lb_realtime;

        # HTTP/1.1 is mandatory: the Upgrade mechanism does not exist in HTTP/1.0,
        # and nginx talks 1.0 to upstreams by default.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        include /etc/nginx/snippets/proxy-common.conf;

        # Socket.IO pings every 25s. These timeouts must comfortably exceed that
        # or nginx will tear down healthy idle connections. Must also stay in the
        # same ballpark as HAProxy's `timeout tunnel 1h`.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Realtime data must not sit in a buffer waiting to be flushed.
        proxy_buffering  off;
        proxy_request_buffering off;
        proxy_cache      off;

        # Never retry a realtime request on another upstream: replaying a
        # handshake against a different replica is exactly the bug stickiness
        # exists to prevent.
        proxy_next_upstream off;
    }

    #==========================================================================
    # ROUTE 2: auth endpoints  ->  load balancer  (tight rate limit)
    #==========================================================================
    location /api/auth/ {
        # burst=30 nodelay: allow a short spike of 30, serve it immediately,
        # then enforce the 60/minute average. Beyond that, 429.
        limit_req zone=auth_zone burst=30 nodelay;

        proxy_pass http://app_lb;
        proxy_http_version 1.1;
        # Empty Connection header = use the upstream keepalive pool.
        proxy_set_header Connection "";

        include /etc/nginx/snippets/proxy-common.conf;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    #==========================================================================
    # ROUTE 3: everything else under /api  ->  load balancer
    #==========================================================================
    location /api/ {
        limit_req zone=api_zone burst=200 nodelay;

        proxy_pass http://app_lb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        include /etc/nginx/snippets/proxy-common.conf;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    #==========================================================================
    # ROUTE 4: health endpoints
    #==========================================================================

    # The reverse proxy's own liveness. Answered locally, so it reports "this
    # nginx is alive" even when everything behind it is down.
    location = /rp-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "reverse-proxy ok\n";
    }

    # Backend health, as chosen by the load balancer. Handy for confirming the
    # whole chain end to end: curl http://localhost:8080/health
    location = /health {
        access_log off;
        proxy_pass http://app_lb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/proxy-common.conf;
    }

    #==========================================================================
    # ROUTE 5: everything else  ->  static SPA container
    #==========================================================================
    # Last because nginx matches prefix locations longest-first, so the specific
    # /api and /socket.io routes above always win.
    location / {
        proxy_pass http://static_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        include /etc/nginx/snippets/proxy-common.conf;

        # Let the static container's own Cache-Control headers pass through
        # untouched; it already distinguishes immutable assets from index.html.
        proxy_read_timeout 30s;
    }

    # Do not serve dotfiles under any circumstance.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
