#==============================================================================
# LAYER 3: LOAD BALANCER  (HAProxy)
#==============================================================================
# Job: take one stream of requests and spread it across backend-1/2/3 using
# LEAST CONNECTIONS, while making sure a Socket.IO session always returns to the
# replica that owns it.
#
# WHY HAPROXY AND NOT NGINX FOR THIS LAYER
# ----------------------------------------
# Socket.IO's default transport starts as HTTP long-polling and only then
# upgrades to WebSocket. That handshake spans several separate HTTP requests that
# share one session id, so they MUST all reach the same replica or the client
# loops forever on "Session ID unknown".
#
# That means we need least-connections AND session affinity at the same time. In
# open-source nginx you cannot have both: `least_conn` and `ip_hash`/`hash` are
# mutually exclusive inside one upstream block, and cookie-based `sticky` is an
# NGINX Plus feature. HAProxy does both in three lines, so nginx stays at the
# reverse-proxy layer where it is strongest and HAProxy does the balancing.
#
# HOW LEAST CONNECTIONS AND STICKINESS COMBINE
# --------------------------------------------
#   request arrives
#     |- has a valid SRVID cookie? -> go straight to that replica (affinity wins)
#     `- no cookie (new session)?  -> pick the replica with the FEWEST active
#                                     connections, then pin it with a cookie
#
# That ordering is what makes it correct. Affinity never breaks an existing
# session, and least-connections still decides where every NEW session lands.
#
# WHY LEAST CONNECTIONS IS THE RIGHT ALGORITHM HERE
# -------------------------------------------------# Round-robin counts requests. This app's connections are long-lived WebSockets
# that last for the whole editing session, and different rooms have wildly
# different traffic. Round-robin would happily hand a 4th user to a replica that
# is already holding 300 sockets. `leastconn` looks at how many connections each
# replica is CURRENTLY holding, which is the metric that actually reflects load
# for persistent connections.
#==============================================================================

global
    # Log to stdout so everything shows up in `docker compose logs load-balancer`.
    log stdout format raw local0 info
    maxconn 8192

    # Do not leak the HAProxy version in error pages.
    tune.bufsize 32768

    # HAProxy expands ${VAR} from the environment, so credentials for the stats
    # page can come from .env instead of being committed here.
    # (see `stats auth` below)

defaults
    log     global
    mode    http
    # `option httplog` is deliberately NOT here - see fe_stats at the bottom.
    option  dontlognull

    # Adds/extends X-Forwarded-For so the backend's `app.set("trust proxy", 2)`
    # can recover the real client IP through both proxy hops.
    option  forwardfor

    # If the chosen replica dies mid-request, try another one instead of 503ing.
    retries 3
    option  redispatch

    #--------------------------------------------------------------------------
    # TIMEOUTS - the single most common source of "my websocket keeps dropping"
    #--------------------------------------------------------------------------
    timeout connect         5s
    timeout client          60s
    timeout server          60s

    # THE IMPORTANT ONE. Once a connection is upgraded to WebSocket, HAProxy
    # stops applying client/server timeouts and uses `tunnel` instead. Leaving it
    # at the default would silently kill idle editor tabs. Socket.IO pings every
    # 25s so 1h is generous but safe.
    timeout tunnel          1h

    timeout http-request    15s
    timeout http-keep-alive 10s
    timeout queue           30s
    timeout check           3s

#------------------------------------------------------------------------------
# DNS: Docker service names are resolved by Docker's embedded DNS at 127.0.0.11.
# Container IPs change on every recreate, so HAProxy must re-resolve at runtime
# rather than caching the IP from startup.
#------------------------------------------------------------------------------
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries       3
    timeout resolve       1s
    timeout retry         1s
    hold valid           10s
    hold other           10s
    hold refused         10s
    hold nx              10s
    hold timeout         10s

#==============================================================================
# FRONTEND: single entry point, receives traffic from the nginx reverse proxy
#==============================================================================
frontend fe_codecollab
    bind *:80

    # Rich HTTP-level access logging, declared here rather than in `defaults` so
    # the stats frontend does not inherit it.
    option httplog

    # HAProxy's own liveness endpoint. Answered by HAProxy itself and never
    # forwarded, so it stays up even if every backend is down.
    monitor-uri /lb-health

    # Useful context in the logs.
    capture request header Host            len 64
    capture request header X-Forwarded-For len 64

    #--------------------------------------------------------------------------
    # ROUTING SPLIT: the two kinds of traffic have different affinity needs, so
    # they get different backends over the SAME three servers.
    #
    #   /socket.io/  -> stateful   -> leastconn + sticky cookie
    #   everything   -> stateless  -> leastconn, no stickiness at all
    #
    # Auth is a JWT in localStorage with no server-side session, so pinning those
    # requests would only reduce how evenly they spread. Splitting here means the
    # REST traffic balances perfectly while the realtime traffic stays pinned.
    #--------------------------------------------------------------------------
    acl is_realtime path_beg /socket.io/

    use_backend be_realtime if is_realtime
    default_backend be_stateless

#==============================================================================
# BACKEND 1: realtime  (Socket.IO - needs affinity)
#==============================================================================
backend be_realtime
    balance leastconn

    #--------------------------------------------------------------------------
    # STICKY SESSIONS
    #   insert   - HAProxy adds a Set-Cookie to the response when it picks a server
    #   indirect - the cookie is stripped from the request before the backend sees
    #              it, so the app never has to know this mechanism exists
    #   nocache  - marks the response private so no shared cache stores a response
    #              carrying someone else's affinity cookie
    #   httponly - JavaScript cannot read it (it is pure infrastructure state)
    #
    # The value comes from `cookie <value>` on each server line below (n1/n2/n3).
    #--------------------------------------------------------------------------
    cookie SRVID insert indirect nocache httponly

    # Active health checks. A replica whose MongoDB connection has dropped returns
    # 503 from /health, and HAProxy pulls it out of rotation rather than sending
    # users to a node that cannot save their work.
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    # `inter 3s fall 3 rise 2` = check every 3s, mark down after 3 consecutive
    # failures, only return to service after 2 consecutive successes.
    server backend-1 backend-1:5000 check inter 3s fall 3 rise 2 cookie n1 maxconn 2000 resolvers docker init-addr last,libc,none
    server backend-2 backend-2:5000 check inter 3s fall 3 rise 2 cookie n2 maxconn 2000 resolvers docker init-addr last,libc,none
    server backend-3 backend-3:5000 check inter 3s fall 3 rise 2 cookie n3 maxconn 2000 resolvers docker init-addr last,libc,none

#==============================================================================
# BACKEND 2: stateless  (REST API + health - pure least connections)
#==============================================================================
backend be_stateless
    balance leastconn

    # Deliberately NO cookie directive. Every request is free to go to whichever
    # replica is least busy. This is the backend to watch when you want to see
    # least-connections balancing in action via /api/whoami.

    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    server backend-1 backend-1:5000 check inter 3s fall 3 rise 2 maxconn 2000 resolvers docker init-addr last,libc,none
    server backend-2 backend-2:5000 check inter 3s fall 3 rise 2 maxconn 2000 resolvers docker init-addr last,libc,none
    server backend-3 backend-3:5000 check inter 3s fall 3 rise 2 maxconn 2000 resolvers docker init-addr last,libc,none

#==============================================================================
# STATS DASHBOARD - http://localhost:8404
#==============================================================================
# Live view of every server, its state, current session count and the queue.
# This is the fastest way to SEE least-connections working: watch the "Cur"
# column while you open editor tabs.
#
# Protected with basic auth because it also exposes an admin socket capability.
# Credentials come from the environment (see docker-compose.yml / .env).
#==============================================================================
frontend fe_stats
    bind *:8404
    mode http

    # Don't log dashboard traffic - it would drown the real access log.
    # `no option httplog` is needed alongside `no log`: without it HAProxy warns
    # "log format ignored for frontend 'fe_stats' since it has no log address"
    # because `option httplog` is inherited from `defaults`. Silencing it keeps
    # the warning counter on the stats page meaningful.
    # Don't log dashboard traffic - it would drown the real access log.
    # NOTE: `option httplog` is declared on fe_codecollab rather than in
    # `defaults` precisely so this frontend does not inherit it. Inheriting it
    # alongside `no log` makes HAProxy warn "log format ignored ... since it has
    # no log address", and `no option httplog` is NOT a valid way to undo it
    # ("negation/default is not supported for option 'httplog'").
    no log

    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth "${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}"
