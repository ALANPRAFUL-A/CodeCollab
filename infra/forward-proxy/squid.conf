#==============================================================================
# LAYER 5: FORWARD PROXY  (Squid)  ->  listens on 3128
#==============================================================================
# A FORWARD proxy is the mirror image of a reverse proxy.
#
#   reverse proxy : internet  ->  proxy  ->  MY servers     (fronts servers, inbound)
#   forward proxy : MY servers ->  proxy  ->  internet      (fronts clients, outbound)
#
# In this stack the backend containers live on a network declared `internal: true`,
# which means Docker gives them NO route to the internet at all. The only way out
# is this container, which is attached to both the internal network and an external
# one. So egress is not merely "encouraged" through the proxy - it is the sole path.
#
# WHY YOU WANT THIS
# -----------------
#  1. ALLOWLISTING. A compromised dependency cannot phone home to an arbitrary
#     host. If it is not in allowed-domains.txt, the connection is refused.
#  2. AUDITING. Every outbound request is logged with the destination. Run
#     `docker compose logs -f forward-proxy` and you can see exactly what your
#     application talks to.
#  3. ONE EGRESS POINT. Useful in real networks where only a handful of IPs are
#     permitted through the corporate firewall.
#  4. CACHING. Repeated plain-HTTP fetches are served from the proxy.
#
# HOW THE BACKEND USES IT
# -----------------------
# docker-compose sets HTTP_PROXY / HTTPS_PROXY / NO_PROXY on the backend
# containers, plus NODE_USE_ENV_PROXY=1. That last one is required: Node only
# honours those variables in its built-in fetch/http/https clients from v22.21 and
# v24.5 onward, which is why the Dockerfile pins node:24-alpine.
#
# IMPORTANT LIMITATION, stated plainly: this is an HTTP/HTTPS proxy. MongoDB and
# Redis speak their own binary wire protocols and do NOT go through it. That is
# fine here because both run inside the internal network. If you moved to MongoDB
# Atlas you would need either a SOCKS proxy or a firewall rule, not Squid.
#==============================================================================

# Port the backends point at.
http_port 3128

visible_hostname codecollab-forward-proxy

#------------------------------------------------------------------------------
# WHO IS ALLOWED TO USE THE PROXY
#------------------------------------------------------------------------------
# Docker's default address pools. Only containers on our networks can be clients;
# this proxy is not an open relay.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

#------------------------------------------------------------------------------
# WHICH PORTS AND METHODS
#------------------------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl CONNECT method CONNECT

#------------------------------------------------------------------------------
# THE ALLOWLIST - this is the security control that matters
#------------------------------------------------------------------------------
# `dstdomain` matches the destination host. An entry beginning with a dot matches
# that domain and all of its subdomains. Edit allowed-domains.txt, then:
#   docker compose restart forward-proxy
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

#------------------------------------------------------------------------------
# ACCESS RULES - evaluated top to bottom, first match wins. Order is everything.
#------------------------------------------------------------------------------
# Block anything that is not plain HTTP or HTTPS.
http_access deny !Safe_ports

# CONNECT is how a client tunnels TLS through a proxy. Restrict it to 443 so it
# cannot be abused to reach SSH or a database on some other port.
http_access deny CONNECT !SSL_ports

# Squid's own cache manager interface: localhost only.
http_access allow localhost manager
http_access deny manager

# THE MAIN RULE: our containers may reach allowlisted domains, and nothing else.
http_access allow localnet allowed_domains

# Default deny. Any request that reaches this line is refused with 403.
http_access deny all

#------------------------------------------------------------------------------
# CACHING - memory only, on purpose
#------------------------------------------------------------------------------
# No `cache_dir` directive, so Squid keeps an in-memory cache and never needs the
# `squid -z` disk-store initialisation step. Simpler and stateless.
#
# Be aware: HTTPS traffic arrives as an opaque CONNECT tunnel, so it CANNOT be
# cached without terminating TLS (SSL bumping), which we are deliberately not
# doing. Caching therefore only benefits plain-HTTP fetches.
cache_mem 64 MB
maximum_object_size_in_memory 512 KB

#------------------------------------------------------------------------------
# PRIVACY / HEADER HYGIENE
#------------------------------------------------------------------------------
# Do not tell external servers about our internal topology.
# `via off` makes Squid log "WARNING: HTTP requires the use of Via" once at
# startup. That is expected: RFC 9110 says a proxy SHOULD add Via, and we are
# deliberately trading that for not advertising the proxy's hostname and version.
via off
forwarded_for delete
httpd_suppress_version_string on

# Squid's canned error pages would otherwise reveal the proxy hostname.
error_directory /usr/share/squid/errors/en

#------------------------------------------------------------------------------
# DNS
#------------------------------------------------------------------------------
# The backends cannot resolve external names themselves (no internet route), so
# Squid resolves on their behalf using Docker's embedded DNS, which it picks up
# automatically from /etc/resolv.conf.
#
# NOTE: `dns_v4_first` was removed in Squid 6 and is a hard config ERROR there.
# If you copy this file into an older Squid, that is the directive to re-add.

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
# DO NOT point these at /dev/stdout. It is tempting, and it fails:
#
#   FATAL: Cannot open '/dev/stdout' for writing.
#   The parent directory must be writeable by the user 'proxy'
#
# Squid drops privileges from root to the `proxy` user, and /dev/stdout is
# /proc/self/fd/1 -> a pipe owned by root, so the reopen gets EACCES.
#
# The ubuntu/squid image solves this for us. Its entrypoint runs:
#   tail -F /var/log/squid/access.log &
#   tail -F /var/log/squid/cache.log  &
# ...before starting Squid. So writing to those FILES (which are owned by `proxy`)
# still surfaces everything in `docker compose logs -f forward-proxy`.
#
# access.log is THE AUDIT TRAIL: client IP, result code (TCP_MISS, TCP_DENIED,
# CONNECT tunnels), byte counts and the full destination for every request.
logfile_rotate 0
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

#------------------------------------------------------------------------------
# TIMEOUTS
#------------------------------------------------------------------------------
connect_timeout 15 seconds
read_timeout 60 seconds
request_timeout 60 seconds

# Shut down promptly on SIGTERM instead of waiting out the default 30s grace.
shutdown_lifetime 5 seconds
