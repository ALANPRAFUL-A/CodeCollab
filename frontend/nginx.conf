# =============================================================================
# Static origin server for the built SPA.
# Mounted at /etc/nginx/conf.d/default.conf, which nginx includes inside its
# `http { }` block - that is why there is no http/events wrapper here.
#
# This container is NOT the reverse proxy. It only serves files. The reverse
# proxy (infra/reverse-proxy/nginx.conf) sits in front of it and decides what
# goes here versus what goes to the load balancer.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Compress text assets. The 2.5 MB Monaco chunk drops to ~650 kB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Hashed build output: index-B-DKSFJE.js etc. The filename changes whenever
    # the content changes, so it is safe to cache forever. "immutable" tells the
    # browser not to even send a revalidation request.
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html is the ONE file that must never be cached. It contains the
    # <script src> pointing at the current hashed bundle; a cached copy would
    # keep loading a deleted chunk after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Container-local health signal for Docker's HEALTHCHECK.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # SPA fallback. This is the nginx equivalent of the vercel.json rewrite:
    #   { "source": "/(.*)", "destination": "/index.html" }
    # React Router owns /login, /register and /room/:roomId. Those paths do not
    # exist on disk, so without try_files a hard refresh on /room/abc123 would
    # return a 404 instead of loading the app.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
