#==============================================================================
# CodeCollab - full stack
#==============================================================================
#   browser
#     |
#     v  :8080
#   [reverse-proxy]  nginx        <-- one public origin, path routing, edge policy
#     |         \
#     |          `--> [frontend]  nginx serving the built React SPA
#     v
#   [load-balancer]  HAProxy      <-- balance leastconn + sticky SRVID cookie
#     |
#     +--> [backend-1] :5000
#     +--> [backend-2] :5000      <-- 3 identical Node replicas
#     +--> [backend-3] :5000
#           |     |
#           |     `--> [redis]    Socket.IO adapter + cross-instance Yjs sync
#           `--------> [mongo]    users + persisted Yjs document state
#
#   [backend-*] --> [forward-proxy] Squid --> internet   (the ONLY egress path)
#
# NETWORK DESIGN - this is the part that makes the forward proxy meaningful:
#
#   edge          normal bridge, has internet. reverse-proxy, frontend, LB.
#   app-internal  internal: true => Docker gives it NO default gateway, so
#                 nothing on it can reach the internet directly.
#   egress        normal bridge, has internet. ONLY the forward proxy is on it.
#
# Because forward-proxy straddles app-internal and egress, it is the single
# bridge to the outside world. The backends are not merely configured to use it,
# they are physically unable to bypass it.
#
# There is no `version:` key on purpose - it has been obsolete since Compose v2.
#==============================================================================

#------------------------------------------------------------------------------
# YAML anchors. The three backend replicas are byte-for-byte identical except for
# INSTANCE_ID, so the shared parts are defined once and they can never drift.
#
# Two separate anchors are needed: `<<` merges maps, so the environment map must
# have its own anchor in order for each replica to add INSTANCE_ID to it.
#------------------------------------------------------------------------------
x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "5000"
  HOST: 0.0.0.0

  # --- data stores ---------------------------------------------------------
  MONGO_URI: mongodb://${MONGO_USER:-codecollab}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/${MONGO_DB:-codecollab}?authSource=admin
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379

  # --- app config ----------------------------------------------------------
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

  # The browser's origin is the REVERSE PROXY, not the backend. Because the
  # frontend now uses relative URLs this list is effectively a safety net, but it
  # must still contain the public origin in case you switch to split origins.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

  # Two trusted proxy hops in front of us: nginx, then HAProxy.
  TRUST_PROXY: "2"

  # --- forward proxy (egress) ---------------------------------------------
  # NODE_USE_ENV_PROXY is what makes Node's built-in fetch/http/https honour
  # these variables. Without it they are ignored and outbound calls hang.
  NODE_USE_ENV_PROXY: "1"
  HTTP_PROXY: http://forward-proxy:3128
  HTTPS_PROXY: http://forward-proxy:3128
  # Internal service-to-service traffic must NOT be sent through the proxy.
  NO_PROXY: localhost,127.0.0.1,::1,mongo,redis,backend-1,backend-2,backend-3,load-balancer,frontend,reverse-proxy,forward-proxy
  ENABLE_EGRESS_TEST: ${ENABLE_EGRESS_TEST:-true}

  # --- Yjs tuning ----------------------------------------------------------
  YJS_SAVE_DEBOUNCE_MS: "2000"    # one Mongo write per 2s burst, not per keystroke
  YJS_IDLE_EVICT_MS: "300000"     # drop a room's cached doc after 5 min idle
  YJS_PEER_SYNC_WAIT_MS: "250"    # how long a cold room waits for peer state

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: codecollab-backend:latest
  restart: unless-stopped
  init: true                       # tiny PID-1 reaper, so SIGTERM reaches node
  expose:
    - "5000"                       # cluster-internal only, never published
  networks:
    - app-internal
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    forward-proxy:
      condition: service_started
  # Caps memory so a runaway room cache cannot take down the host. The idle
  # eviction in yjsService.js is what keeps us comfortably under this.
  mem_limit: 512m

services:

  #===========================================================================
  # LAYER 1: static SPA origin
  #===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # EMPTY = same origin. src/config.js turns that into relative URLs, so
        # every request goes through the reverse proxy. Vite inlines this at BUILD
        # time, which is why it is a build arg and not an environment variable:
        # changing it requires `docker compose build frontend`.
        VITE_API_URL: ${VITE_API_URL:-}
    image: codecollab-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  #===========================================================================
  # LAYER 2: REVERSE PROXY - the only thing the browser talks to
  #===========================================================================
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./infra/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/reverse-proxy/snippets:/etc/nginx/snippets:ro
    networks:
      - edge
    # nginx resolves `upstream` hostnames ONCE at startup and refuses to boot if
    # they do not resolve, so both targets must be healthy first.
    depends_on:
      frontend:
        condition: service_healthy
      load-balancer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/rp-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  #===========================================================================
  # LAYER 3: LOAD BALANCER - least connections + sticky sessions
  #===========================================================================
  load-balancer:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    ports:
      # Stats dashboard. Basic-auth protected; credentials come from .env.
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    volumes:
      - ./infra/load-balancer/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      # HAProxy expands ${VAR} from its own environment inside haproxy.cfg.
      HAPROXY_STATS_USER: ${HAPROXY_STATS_USER:-admin}
      HAPROXY_STATS_PASSWORD: ${HAPROXY_STATS_PASSWORD:?set HAPROXY_STATS_PASSWORD in .env}
    networks:
      - edge            # reachable by the reverse proxy
      - app-internal    # can reach the backend replicas
    # service_started, not service_healthy: HAProxy is built to start with dead
    # servers and add them as its own health checks start passing. Waiting would
    # only slow startup down.
    depends_on:
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
    healthcheck:
      # /lb-health is answered by HAProxy itself (monitor-uri), so this reports
      # "the balancer is alive" independently of backend state.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  #===========================================================================
  # LAYER 4: the application - three identical replicas
  #===========================================================================
  backend-1:
    <<: *backend-common
    container_name: codecollab-backend-1
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend-common
    container_name: codecollab-backend-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend-common
    container_name: codecollab-backend-3
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-3

  #===========================================================================
  # LAYER 5: FORWARD PROXY - the single, auditable egress point
  #===========================================================================
  forward-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./infra/forward-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./infra/forward-proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      - app-internal   # where its clients (the backends) live
      - egress         # its own route to the internet
    ports:
      # Published only so you can test the proxy from your own machine:
      #   curl -x http://localhost:3128 https://api.github.com/zen
      # Bound to 127.0.0.1 so it is never an open relay on your LAN.
      - "127.0.0.1:${SQUID_PORT:-3128}:3128"
    healthcheck:
      # `squid -k check` signals the RUNNING squid via its PID file, so it proves
      # the daemon is alive and its config parses.
      #
      # A bare TCP probe (bash </dev/tcp/...) also "works" but opens and closes a
      # connection without sending headers, which litters access.log with
      # `NONE_NONE/000 error:transaction-end-before-headers` on every check.
      test: ["CMD", "/usr/sbin/squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  #===========================================================================
  # DATA STORES - internal network only, never published
  #===========================================================================
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-codecollab}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    networks:
      - app-internal
    healthcheck:
      # `ping` is one of the few commands allowed before authentication, so this
      # works without embedding credentials in the healthcheck.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly yes = durable across restarts, so a redeploy does not lose the
    # pub/sub-adjacent state. requirepass is defence in depth: even on an internal
    # network, an unauthenticated Redis is one misconfiguration away from exposure.
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

#==============================================================================
networks:
  # Public-facing side. Has a default gateway, so it can reach the internet.
  edge:
    driver: bridge

  # THE ISOLATED SIDE. `internal: true` tells Docker not to attach a gateway, so
  # containers here have no route off the host. Verify it yourself:
  #   docker compose exec backend-1 wget -qO- --timeout=5 https://example.com
  #     -> hangs/fails
  #   docker compose exec backend-1 env | grep -i proxy
  #     -> shows the Squid address it is forced to use instead
  app-internal:
    driver: bridge
    internal: true

  # Exists solely to give the forward proxy a way out.
  egress:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
